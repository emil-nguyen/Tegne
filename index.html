<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F4EDE1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17100C" media="(prefers-color-scheme: dark)">
<title>Tegnehjælp</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Tegne">
<style>
:root{--bg:#F4EDE1;--card:#FBF7F0;--ink:#2A1A11;--ink2:rgba(70,45,30,.62);--accent:#3E2518;--on:#F6EEDF;--fill:rgba(90,60,40,.12);--sep:rgba(70,45,30,.18);--mat:rgba(246,239,226,.84);--seg:#FFFBF4;--red:#B23A2B;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#17100C;--card:#241811;--ink:#F4EBDC;--ink2:rgba(244,235,220,.6);--accent:#E8D8BD;--on:#2A1A11;--fill:rgba(244,235,220,.12);--sep:rgba(244,235,220,.16);--mat:rgba(36,24,17,.84);--seg:#4A3427;--red:#E0604F}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;touch-action:none}
#stage{position:fixed;inset:0;overflow:hidden;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#overlay{position:absolute;left:0;top:0;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:none;max-width:none}
#grid{position:fixed;inset:0;z-index:2;pointer-events:none;display:none;background:
linear-gradient(#fff8,#fff8) 33.33% 0/1px 100% no-repeat,linear-gradient(#fff8,#fff8) 66.66% 0/1px 100% no-repeat,
linear-gradient(#fff8,#fff8) 0 33.33%/100% 1px no-repeat,linear-gradient(#fff8,#fff8) 0 66.66%/100% 1px no-repeat,
linear-gradient(#C69C6Dcc,#C69C6Dcc) 50% 0/1px 100% no-repeat,linear-gradient(#C69C6Dcc,#C69C6Dcc) 0 50%/100% 1px no-repeat}
#start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(28px,env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));text-align:center;background:var(--bg);overflow-y:auto;touch-action:pan-y}
.appicon{width:76px;height:76px;border-radius:18px;background:linear-gradient(#5B3A28,#2A1A11);display:grid;place-items:center;box-shadow:0 6px 18px rgba(42,26,17,.35);flex:none}
.appicon svg{width:50px;height:50px}
#start h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.3px;margin:6px 0 0}
#start p{max-width:28ch;color:var(--ink2);margin:0}
#start h2{font-size:13px;font-weight:400;text-transform:uppercase;color:var(--ink2);margin:14px 0 6px;text-align:left;padding-left:16px}
#savedT{width:min(360px,100%)}
button,label.btn{font:inherit;font-size:15px;color:var(--ink);background:var(--fill);border:0;border-radius:12px;padding:0 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active,label.btn:active{opacity:.55}
button:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.main{background:var(--accent)!important;color:var(--on)!important}
#recb.main{background:var(--red)!important;color:#fff!important}
#start label.main{width:min(360px,100%);min-height:50px;border-radius:14px;font-size:17px;font-weight:600;margin-top:10px}
#back{background:none;color:var(--accent);font-size:17px}
input[type=file]{display:none}
#err{color:var(--red);max-width:32ch;min-height:1.2em;font-size:15px}
#saved{width:min(360px,100%);background:var(--card);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:left}
#saved:empty{display:none}
.item{display:flex;align-items:center;gap:12px;padding:8px 4px 8px 16px}
.item+.item{border-top:.5px solid var(--sep)}
.item img{width:40px;height:40px;object-fit:cover;border-radius:8px;flex:none}
.item button{background:none;border-radius:0}
.item button:nth-child(2){flex:1;justify-content:flex-start;padding:0;font-size:17px;overflow:hidden;white-space:nowrap}
.item button:last-child{width:44px;padding:0;color:var(--red);font-size:17px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:none;flex-direction:column;gap:10px;padding:2px 16px calc(14px + env(safe-area-inset-bottom));background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);border-radius:20px 20px 0 0;box-shadow:0 -.5px 0 var(--sep);transition:transform .3s cubic-bezier(.32,.72,0,1)}
#bar.show{display:flex}#bar.hidden{transform:translateY(105%)}
.grab{align-self:center;width:80px;height:20px;position:relative;cursor:pointer}
.grab::after{content:"";position:absolute;left:22px;top:7px;width:36px;height:5px;border-radius:3px;background:var(--ink2);opacity:.45}
.tabs{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.tabs button{flex:1;min-height:32px;border-radius:7px;background:transparent;font-size:13px;font-weight:500;padding:0}
.tabs button.on{background:var(--seg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04)}
.pane{display:none;flex-direction:column;gap:8px}.pane.on{display:flex}
.row{display:flex;gap:8px;align-items:center}
.row>label[for]{font-size:15px;width:96px;flex:none}
.row input[type=range]{flex:1;accent-color:var(--accent);height:28px}
.row.b>*{flex:1;min-width:0;padding:0 2px}
.row.b>.tile{flex-direction:column;gap:5px;min-height:64px;font-size:11px;font-weight:500;border-radius:14px;padding:8px 2px}
.tile svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#pb .row:nth-child(-n+2)>button{min-height:48px;font-size:22px;font-weight:400}
#toggle{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:6;display:none;width:44px;height:44px;padding:0;border-radius:50%;background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
#toggle svg{display:block;margin:auto;width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
#hint,#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:7;width:max-content;max-width:calc(100% - 140px);font-size:14px;line-height:1.35;text-align:center;background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:9px 14px;border-radius:16px;display:none;pointer-events:none;box-shadow:0 2px 12px rgba(0,0,0,.12)}
#toast{top:calc(64px + env(safe-area-inset-top,0px));max-width:calc(100% - 32px)}
#pj{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:8;display:none;gap:8px;opacity:.75}
#pj button{background:var(--mat);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);min-height:40px;border-radius:20px;padding:0 16px}
#done{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:24px}
#done div{background:var(--card);border-radius:14px;padding:20px 16px 16px;display:flex;flex-direction:column;gap:10px;text-align:center;width:min(300px,100%)}
#done button{min-height:46px}
@media (prefers-reduced-motion:reduce){#bar{transition:none}}
@media (prefers-reduced-transparency:reduce){#bar,#hint,#toast,#toggle,#pj button{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--card)}}
</style>
</head>
<body>
<div id="stage"><video id="cam" autoplay playsinline muted></video><img id="overlay" alt=""></div>
<div id="grid"></div>

<div id="start">
  <div class="appicon"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="9" cy="47" r="1.7" fill="#C69C6D"/><circle cx="14.5" cy="52.5" r="1.7" fill="#C69C6D"/><g transform="rotate(45 32 32)"><rect x="26" y="6" width="12" height="9" rx="3" fill="#C69C6D"/><rect x="26" y="15" width="12" height="2" fill="#96704B"/><rect x="26" y="17" width="12" height="25" fill="#F4EBDC"/><path d="M26 42h12l-6 12z" fill="#E2BE92"/><path d="M29.2 49.8h5.6L32 54z" fill="#2A1A11"/></g></svg></div>
  <h1>Tegnehjælp</h1>
  <p>Vælg et billede, hold telefonen over papiret, og tegn stregerne efter.</p>
  <label class="btn main">Vælg billede<input id="file" type="file" accept="image/*,.heic,.heif,.avif,.webp,.bmp,.tif,.tiff,.gif,.svg"></label>
  <button id="back" style="display:none">Tilbage til tegning</button>
  <p id="err" role="alert"></p>
  <div id="savedT" style="display:none"><h2>Gemte opsætninger</h2></div>
  <div id="saved"></div>
</div>

<div id="hint"></div><div id="toast" role="status"></div>
<button id="toggle" aria-label="Skjul eller vis menu"><svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h16"/><circle cx="9" cy="8" r="2.3" fill="var(--bg)"/><circle cx="15" cy="16" r="2.3" fill="var(--bg)"/></svg></button>
<div id="pj"><button id="inv">Inverter</button><button id="pjx" class="main">Luk</button></div>

<div id="bar">
  <div class="grab" id="grab" role="button" aria-label="Skjul menu"></div>
  <div class="tabs"><button data-t="a" class="on">Vis</button><button data-t="b">Placér</button><button data-t="c">Gem</button></div>
  <div class="pane on" id="pa">
    <div class="row"><label for="op">Gennemsigtig</label><input id="op" type="range" min="5" max="100" value="50"></div>
    <div class="row b"><button class="tile" id="gray"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>Sort/hvid</button><button class="tile" id="edge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18l6-10 4 6 3-4 5 8z"/></svg>Konturer</button><button class="tile" id="gridb"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></svg>Gitter</button><button class="tile" id="flip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"/><path d="M8 7L3 12l5 5zM16 7l5 5-5 5z"/></svg>Spejl</button></div>
  </div>
  <div class="pane" id="pb">
    <div class="row b"><button id="nl" aria-label="Flyt til venstre">←</button><button id="nu" aria-label="Flyt op">↑</button><button id="nd" aria-label="Flyt ned">↓</button><button id="nr" aria-label="Flyt til højre">→</button></div>
    <div class="row b"><button id="rl" aria-label="Drej mod uret">⟲</button><button id="rr" aria-label="Drej med uret">⟳</button><button id="sm" aria-label="Mindre">−</button><button id="sp" aria-label="Større">+</button></div>
    <div class="row b"><button class="tile" id="lock"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Lås</button><button class="tile" id="reset"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5M4 4v4.5h4.5"/></svg>Nulstil</button><button class="tile" id="torch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L6 13.5h5L10 21l7-10.5h-5z"/></svg>Lys</button></div>
    <div class="row" id="zrow" style="display:none"><label for="zoom">Kamerazoom</label><input id="zoom" type="range"></div>
  </div>
  <div class="pane" id="pc">
    <div class="row b"><button class="tile main" id="save"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v16l-5-4-5 4z"/></svg>Gem</button><button class="tile" id="open"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h6l2 2h8V19H4z"/></svg>Gemte</button></div>
    <div class="row b"><button class="tile" id="recb"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>Optag</button><button class="tile" id="pjb"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="M8 21h8M12 17v4"/></svg>Projektor</button><label class="btn tile"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17l5-4 3 3 3-2 3 3"/></svg>Nyt billede<input id="file2" type="file" accept="image/*,.heic,.heif,.avif,.webp,.bmp,.tif,.tiff,.gif,.svg"></label></div>
  </div>
</div>

<div id="done"><div><strong>Videoen er klar</strong><button id="dlb" class="main">Gem / del video</button><button id="closeb">Luk</button></div></div>

<script>
const $=id=>document.getElementById(id);
const cam=$('cam'),img=$('overlay'),bar=$('bar'),stage=$('stage');
let st={x:0,y:0,s:1,r:0,flip:1},W=1,H=1,locked=false,gray=false,edge=false,track=null,torchOn=false,
    origSrc=null,origBlob=null,curName='',pj=false,inv=false,mr=null,chunks=[],raf=0,cv,cc,gc=null,gk='';
const toast=(t,ms=2600)=>{const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)};
const flag=(id,on)=>$(id).classList.toggle('main',!!on);
const keepAwake=()=>{'wakeLock' in navigator&&navigator.wakeLock.request('screen').catch(()=>{})};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&origSrc)keepAwake()});

function apply(){img.style.transform=`translate(${st.x}px,${st.y}px) rotate(${st.r}rad) scale(${st.s*st.flip},${st.s})`}
function fit(){const w=innerWidth,h=innerHeight;st={x:(w-W)/2,y:(h-H)/2-40,s:Math.min(w*.8/W,h*.5/H),r:0,flip:1};apply()}
function look(){img.style.filter=[gray&&'grayscale(1) contrast(1.4)',pj&&inv&&'invert(1)'].filter(Boolean).join(' ')||'none';img.style.opacity=pj?1:$('op').value/100}

function makeEdges(src){return new Promise(res=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,900/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
  const p=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h),o=x.createImageData(w,h);
  for(let i=0;i<w*h;i++){const a=p[i*4+3]/255;g[i]=(.3*p[i*4]+.59*p[i*4+1]+.11*p[i*4+2])*a+255*(1-a)}
  for(let y=1;y<h-1;y++)for(let u=1;u<w-1;u++){const i=y*w+u,
    gx=-g[i-w-1]-2*g[i-1]-g[i+w-1]+g[i-w+1]+2*g[i+1]+g[i+w+1],gy=-g[i-w-1]-2*g[i-w]-g[i-w+1]+g[i+w-1]+2*g[i+w]+g[i+w+1],
    m=Math.min(255,Math.hypot(gx,gy)*1.2),j=i*4;o.data[j]=o.data[j+1]=o.data[j+2]=20;o.data[j+3]=m>40?m:0}
  x.putImageData(o,0,0);res(c.toDataURL())};im.src=src})}

const toURL=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)});
const fail=m=>{$('err').textContent=m;toast(m,6000)};
const loadScript=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=no;document.head.append(e)});
// Åbn næsten alle billedtyper, også HEIC fra iPhone, WebP, AVIF, GIF, BMP og SVG
async function decode(file){
  const tryIt=async b=>{
    try{if(window.createImageBitmap)return await createImageBitmap(b,{imageOrientation:'from-image'})}catch(e){}
    const u=await toURL(b);return await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u})};
  try{return await tryIt(file)}catch(e){}
  if(/hei[cf]/i.test(file.type)||/\.hei[cf]$/i.test(file.name||'')||!file.type){
    await loadScript('https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js');
    let o=await heic2any({blob:file,toType:'image/jpeg',quality:.92});if(Array.isArray(o))o=o[0];
    return await tryIt(o)}
  throw new Error('format')}
async function normalize(file){ // gør billedet til et almindeligt billede på max 2048 px
  const im=await decode(file);
  let w=im.width||im.naturalWidth||1024,h=im.height||im.naturalHeight||1024;
  const k=Math.min(1,2048/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
  const a=/png|webp|gif|svg|avif/i.test(file.type);
  return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('canvas')),a?'image/png':'image/jpeg',.92))}
async function load(blob,r){
  if(!blob)return;
  const info=(blob.type||(blob.name||'').split('.').pop()||'ukendt')+', '+(blob.size/1048576).toFixed(1)+' MB';
  if(!r){toast('Indlæser billede…',20000);try{blob=await normalize(blob)}catch(e){fail('Billedet kunne ikke åbnes ('+info+'). Prøv et andet billede.');return}}
  origBlob=blob;try{origSrc=await toURL(blob)}catch(e){fail('Billedet kunne ikke læses ('+info+').');return}edge=false;gray=false;st.flip=1;
  try{await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=origSrc})}
  catch(e){fail('Billedet kunne ikke læses ('+info+').');origSrc=null;return}
  if(!r)$('toast').style.display='none';
  W=img.naturalWidth;H=img.naturalHeight;img.style.width=W+'px';img.style.height=H+'px';
  if(r){ // gendan placering ud fra skærmens størrelse
    const vw=innerWidth,vh=innerHeight;curName=r.name;$('op').value=r.op;gray=r.gray;
    st={x:r.cx*vw-W/2,y:r.cy*vh-H/2,s:r.sw*vw/W,r:r.r,flip:r.flip};
    if(r.edge){edge=true;img.src=await makeEdges(origSrc)}
    apply();toast('Åbnet: '+r.name);
  }else{curName='';fit()}
  flag('gray',gray);flag('edge',edge);look();await startCamera();
}
function showUI(){$('start').style.display='none';$('back').style.display='';if(!pj){bar.classList.add('show');$('toggle').style.display='block'}
  const h=$('hint');h.style.display='block';setTimeout(()=>h.style.display='none',8000)}
async function startCamera(){
  if(cam.srcObject){showUI();return}
  let msg='';
  if(!window.isSecureContext||!navigator.mediaDevices)msg='Kameraet kræver https. Åbn siden via dit github.io-link.';
  else try{
    let s;try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
    catch(e1){if(e1.name==='NotAllowedError')throw e1;s=await navigator.mediaDevices.getUserMedia({video:true,audio:false})}
    cam.srcObject=s;await cam.play().catch(()=>{});track=s.getVideoTracks()[0];
    const c=track.getCapabilities?track.getCapabilities():{};
    if(!c.torch)$('torch').style.display='none';
    if(c.zoom){const z=$('zoom');z.min=c.zoom.min;z.max=c.zoom.max;z.step=c.zoom.step||.1;z.value=c.zoom.min;$('zrow').style.display='flex'}
    keepAwake();
  }catch(e){msg=e.name==='NotAllowedError'?'Kameraet er blokeret. Tillad kamera i browserens indstillinger.':'Kameraet kunne ikke startes ('+e.name+'). Åbn siden i Safari eller Chrome.';$('torch').style.display='none'}
  $('hint').textContent=msg||'Træk med én finger. Knib med to for at flytte, zoome og dreje.';showUI();
}

// ---- Gemte opsætninger (IndexedDB) ----
const db=new Promise((ok,no)=>{const q=indexedDB.open('tegne',1);q.onupgradeneeded=()=>q.result.createObjectStore('s',{keyPath:'name'});q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const tx=(m,f)=>db.then(d=>new Promise((ok,no)=>{const t=d.transaction('s',m),r=f(t.objectStore('s'));t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)}));
async function save(){
  if(!origBlob)return;
  const name=(prompt('Navn på opsætningen (samme navn overskriver):',curName||'Min opsætning')||'').trim();if(!name)return;
  const vw=innerWidth,vh=innerHeight;
  const r={name,blob:origBlob,op:+$('op').value,gray,edge,flip:st.flip,r:st.r,cx:(st.x+W/2)/vw,cy:(st.y+H/2)/vh,sw:st.s*W/vw,t:Date.now()};
  try{await tx('readwrite',s=>s.put(r));curName=name;toast('Gemt: '+name)}catch(e){toast('Kunne ikke gemme. Slå privat browsing fra.')}
}
async function list(){
  const box=$('saved');box.innerHTML='';let all=[];
  try{all=await tx('readonly',s=>s.getAll())}catch(e){}
  all.sort((a,b)=>b.t-a.t).forEach(r=>{
    const d=document.createElement('div');d.className='item';
    const i=new Image();i.alt='';toURL(r.blob).then(u=>i.src=u).catch(()=>{});
    const b=document.createElement('button');b.textContent=r.name;b.onclick=()=>load(r.blob,r);
    const x=document.createElement('button');x.textContent='✕';x.setAttribute('aria-label','Slet '+r.name);
    x.onclick=async()=>{if(confirm('Slet "'+r.name+'"?')){await tx('readwrite',s=>s.delete(r.name));list()}};
    d.append(i,b,x);box.append(d)});
  $('savedT').style.display=all.length?'block':'none';
}
list();

// ---- Optagelse (kamera + billede lagt sammen) ----
function grayOf(){const k=img.src.slice(-40)+img.naturalWidth;
  if(gk!==k){const s=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
    c.width=img.naturalWidth*s|0;c.height=img.naturalHeight*s|0;const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
    const d=x.getImageData(0,0,c.width,c.height),p=d.data;
    for(let i=0;i<p.length;i+=4){const g=Math.max(0,Math.min(255,(.3*p[i]+.59*p[i+1]+.11*p[i+2]-128)*1.4+128));p[i]=p[i+1]=p[i+2]=g}
    x.putImageData(d,0,0);gc=c;gk=k}
  return gc}
function draw(){
  const vw=innerWidth,vh=innerHeight,k=cv.width/vw,x=cc;
  x.setTransform(1,0,0,1,0,0);x.fillStyle='#000';x.fillRect(0,0,cv.width,cv.height);x.setTransform(k,0,0,k,0,0);
  if(!pj&&cam.videoWidth){const q=Math.max(vw/cam.videoWidth,vh/cam.videoHeight),w=cam.videoWidth*q,h=cam.videoHeight*q;x.drawImage(cam,(vw-w)/2,(vh-h)/2,w,h)}
  x.save();x.globalAlpha=pj?1:$('op').value/100;x.translate(st.x+W/2,st.y+H/2);x.rotate(st.r);x.scale(st.s*st.flip,st.s);
  x.drawImage(gray?grayOf():img,-W/2,-H/2,W,H);x.restore();
  if(mr)raf=requestAnimationFrame(draw)}
function toggleRec(){
  if(mr){mr.stop();return}
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){toast('Optagelse understøttes ikke i denne browser');return}
  const q=Math.min(1,1280/Math.max(innerWidth,innerHeight));
  cv=document.createElement('canvas');cv.width=Math.round(innerWidth*q/2)*2;cv.height=Math.round(innerHeight*q/2)*2;cc=cv.getContext('2d');
  const mt=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  chunks=[];mr=new MediaRecorder(cv.captureStream(30),mt?{mimeType:mt,videoBitsPerSecond:5e6}:{});
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=()=>{cancelAnimationFrame(raf);const type=mr.mimeType||mt||'video/webm';mr=null;$('recb').lastChild.textContent='Optag';flag('recb',0);finish(new Blob(chunks,{type}))};
  mr.start(1000);draw();$('recb').lastChild.textContent='Stop';flag('recb',1);toast('Optager. Tryk Stop, når du er færdig.',3500)}
function finish(blob){
  const f=new File([blob],'tegning.'+(blob.type.includes('mp4')?'mp4':'webm'),{type:blob.type});
  $('done').style.display='flex';
  $('dlb').onclick=async()=>{
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click()};
  $('closeb').onclick=()=>$('done').style.display='none'}

// ---- Projektor: kun billedet på sort baggrund ----
function setPj(on){
  pj=on;if(on){inv=edge;flag('inv',inv)}cam.style.visibility=on?'hidden':'visible';stage.style.background=on?'#000':'#1a1917';
  $('pj').style.display=on?'flex':'none';bar.classList.toggle('show',!on&&!!origSrc);$('toggle').style.display=on?'none':'block';
  $('grid').style.display='none';flag('gridb',0);look();
  if(on){keepAwake();toast('Projektor: billedet vises alene. Flyt og zoom som før.',3500);document.documentElement.requestFullscreen?.().catch(()=>{})}
  else if(document.fullscreenElement)document.exitFullscreen()}

// ---- Knapper ----
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button,.pane').forEach(e=>e.classList.remove('on'));b.classList.add('on');$('p'+b.dataset.t).classList.add('on')});
$('file').onchange=e=>{const f=e.target.files[0];load(f).finally(()=>{e.target.value=''})};
$('file2').onchange=e=>{const f=e.target.files[0];load(f).finally(()=>{e.target.value=''})};
$('op').oninput=look;
$('gray').onclick=()=>{gray=!gray;flag('gray',gray);look()};
$('edge').onclick=async()=>{edge=!edge;flag('edge',edge);img.src=edge?await makeEdges(origSrc):origSrc};
$('gridb').onclick=()=>{const g=$('grid');const on=g.style.display!=='block';g.style.display=on?'block':'none';flag('gridb',on)};
$('flip').onclick=()=>{st.flip*=-1;apply()};
$('reset').onclick=fit;
$('lock').onclick=()=>{locked=!locked;$('lock').lastChild.textContent=locked?'Lås op':'Lås';flag('lock',locked)};
$('torch').onclick=async()=>{torchOn=!torchOn;try{await track.applyConstraints({advanced:[{torch:torchOn}]});flag('torch',torchOn)}catch(e){}};
$('zoom').oninput=e=>track&&track.applyConstraints({advanced:[{zoom:+e.target.value}]}).catch(()=>{});
$('toggle').onclick=()=>bar.classList.toggle('hidden');
$('grab').onclick=()=>bar.classList.add('hidden');
$('save').onclick=save;
$('open').onclick=()=>{list();$('start').style.display='flex'};
$('back').onclick=()=>$('start').style.display='none';
$('recb').onclick=toggleRec;
$('pjb').onclick=()=>setPj(true);$('pjx').onclick=()=>setPj(false);
$('inv').onclick=()=>{inv=!inv;flag('inv',inv);look()};
function hold(id,fn){const b=$(id);let t=null;
  const stop=()=>{clearInterval(t);t=null};
  const go=()=>{if(document.hidden){stop();return}fn();apply()};
  b.onpointerdown=e=>{e.preventDefault();stop();go();t=setInterval(go,70)};
  ['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(n=>b.addEventListener(n,stop));
  ['pointerup','pointercancel','touchend','touchcancel','blur','contextmenu'].forEach(n=>window.addEventListener(n,stop));
  document.addEventListener('visibilitychange',stop)}
hold('nl',()=>st.x-=2);hold('nr',()=>st.x+=2);hold('nu',()=>st.y-=2);hold('nd',()=>st.y+=2);
hold('rl',()=>st.r-=.0035);hold('rr',()=>st.r+=.0035);hold('sm',()=>st.s=Math.max(.02,st.s/1.005));hold('sp',()=>st.s=Math.min(30,st.s*1.005));

// ---- Berøring: ét finger flytter, to fingre flytter, zoomer og drejer ----
const ptr=new Map();
stage.addEventListener('pointerdown',e=>{if(ptr.size>=2)ptr.clear();ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});stage.setPointerCapture(e.pointerId)});
['pointerup','pointercancel'].forEach(n=>window.addEventListener(n,e=>ptr.delete(e.pointerId)));
['touchend','touchcancel'].forEach(n=>window.addEventListener(n,e=>{if(!e.touches.length)ptr.clear()}));
window.addEventListener('blur',()=>ptr.clear());
document.addEventListener('visibilitychange',()=>ptr.clear());
stage.addEventListener('lostpointercapture',e=>ptr.delete(e.pointerId));
stage.addEventListener('pointermove',e=>{
  if(locked||!ptr.has(e.pointerId))return;
  const p=ptr.get(e.pointerId);
  if(ptr.size===1){st.x+=e.clientX-p.x;st.y+=e.clientY-p.y}
  else if(ptr.size===2){
    const [a,b]=[...ptr.entries()],o=a[0]===e.pointerId?b[1]:a[1],
      d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);
    let da=Math.atan2(e.clientY-o.y,e.clientX-o.x)-Math.atan2(p.y-o.y,p.x-o.x);
    if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;
    if(d0>20){st.s=Math.min(30,Math.max(.02,st.s*d1/d0));st.r+=da}
    st.x+=(e.clientX-p.x)/2;st.y+=(e.clientY-p.y)/2}
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});apply()});
stage.addEventListener('wheel',e=>{if(locked)return;e.preventDefault();st.s=Math.min(30,Math.max(.02,st.s*(e.deltaY<0?1.06:.94)));apply()},{passive:false});
</script>
