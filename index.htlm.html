<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F0EEE6">
<title>Tegnehjælp</title>
<style>
  :root{
    --bg:#F0EEE6; --panel:rgba(250,249,245,.95); --ink:#29261F; --muted:#6B665B;
    --accent:#C96442; --accent-ink:#fff; --soft:#E6E0D2; --border:#D9D2C1;
    --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
    --sans:-apple-system,"Segoe UI",system-ui,Roboto,sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#262624;--panel:rgba(38,38,36,.95);--ink:#F0EEE6;--muted:#A8A396;
      --accent:#D97757;--accent-ink:#262624;--soft:#3A3935;--border:#4A4842}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);overflow:hidden;touch-action:none}
  #stage{position:fixed;inset:0;overflow:hidden;background:#1a1917}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #overlay{position:absolute;left:0;top:0;transform-origin:center center;will-change:transform;
    user-select:none;-webkit-user-drag:none;pointer-events:none;max-width:none}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;padding:32px;text-align:center;background:var(--bg);z-index:10}
  #start svg{width:56px;height:56px;color:var(--accent)}
  #start h1{font-family:var(--serif);font-weight:400;font-size:2.4rem;letter-spacing:-.01em;margin:0}
  #start p{max-width:30ch;line-height:1.55;margin:0;color:var(--muted);font-size:1.02rem}
  button,label.btn{font:inherit;font-size:.95rem;color:var(--ink);background:var(--soft);
    border:1px solid var(--border);border-radius:10px;
    padding:11px 14px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  button:active,label.btn:active{transform:scale(.98)}
  button.main,label.main{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
  button:focus-visible,label.btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
  #start label.main{padding:13px 26px;font-size:1.05rem;border-radius:12px}
  input[type=file]{display:none}
  #bar{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;
    background:var(--panel);border:1px solid var(--border);border-radius:18px;
    padding:14px;display:none;gap:10px;flex-direction:column;
    box-shadow:0 8px 30px rgba(41,38,31,.18);backdrop-filter:blur(10px);
    transition:transform .2s ease}
  #bar.show{display:flex}
  #bar.hidden{transform:translateY(130%)}
  .row{display:flex;gap:8px;align-items:center}
  .row > label[for]{font-size:.85rem;color:var(--muted);width:92px;flex:none}
  .row input[type=range]{flex:1;accent-color:var(--accent)}
  .row.btns{flex-wrap:wrap}
  .row.btns>*{flex:1;min-width:90px}
  #toggle{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:6;display:none;
    border-radius:50%;width:46px;padding:0;background:var(--panel)}
  #hint{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:6;
    max-width:calc(100% - 80px);font-size:.82rem;line-height:1.4;background:var(--panel);
    border:1px solid var(--border);padding:9px 12px;border-radius:12px;display:none;pointer-events:none}
  #err{color:var(--accent);max-width:32ch;min-height:1.2em}
  @media (prefers-reduced-motion: reduce){#bar{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <img id="overlay" alt="">
</div>

<div id="start">
  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" aria-hidden="true"><path d="M32 6v52M6 32h52M13.6 13.6l36.8 36.8M50.4 13.6L13.6 50.4"/></svg>
  <h1>Tegnehjælp</h1>
  <p>Vælg et billede, hold telefonen over et stykke papir, og tegn stregerne efter.</p>
  <label class="btn main">Vælg billede<input id="file" type="file" accept="image/*"></label>
  <p id="err" role="alert"></p>
</div>

<div id="hint">Træk med én finger. Knib med to for at flytte, zoome og dreje.</div>
<button id="toggle" aria-label="Skjul eller vis knapper">☰</button>

<div id="bar">
  <div class="row"><label for="op">Gennemsigtig</label><input id="op" type="range" min="5" max="100" value="50"></div>
  <div class="row btns">
    <button id="gray">Sort/hvid</button>
    <button id="edge">Konturer</button>
    <button id="lock">Lås</button>
    <button id="torch">Lys</button>
  </div>
  <div class="row btns">
    <button id="flip">Spejlvend</button>
    <button id="reset">Nulstil</button>
    <label class="btn main">Nyt billede<input id="file2" type="file" accept="image/*"></label>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const cam = $('cam'), img = $('overlay'), bar = $('bar'), hint = $('hint');
let st = {x:0,y:0,s:1,r:0,flip:1}, locked=false, gray=false, edge=false, track=null, torchOn=false;
let originalSrc = null;

function apply(){
  img.style.transform =
    `translate(${st.x}px,${st.y}px) rotate(${st.r}rad) scale(${st.s*st.flip},${st.s})`;
}
let W=1,H=1;
function resetView(){
  const w = innerWidth, h = innerHeight;
  const fit = Math.min(w*0.8/W, h*0.5/H);
  st = {x:(w-W)/2, y:(h-H)/2 - 40, s:fit, r:0, flip:1};
  img.style.transformOrigin = 'center center';
  apply();
}
function filters(){
  const f = [];
  if (gray) f.push('grayscale(1) contrast(1.4)');
  img.style.filter = f.join(' ');
}
// Konturer: simpel kantfinder på canvas, så stregerne bliver tydelige
function makeEdges(src){
  return new Promise(res=>{
    const im = new Image();
    im.onload = ()=>{
      const max=900, k=Math.min(1,max/Math.max(im.width,im.height));
      const w=Math.round(im.width*k), h=Math.round(im.height*k);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const x=c.getContext('2d'); x.drawImage(im,0,0,w,h);
      const d=x.getImageData(0,0,w,h), p=d.data, g=new Float32Array(w*h);
      for(let i=0;i<w*h;i++){const a=p[i*4+3]/255; g[i]=(0.3*p[i*4]+0.59*p[i*4+1]+0.11*p[i*4+2])*a+255*(1-a);}
      const o=x.createImageData(w,h);
      for(let y=1;y<h-1;y++)for(let xx=1;xx<w-1;xx++){
        const i=y*w+xx;
        const gx=-g[i-w-1]-2*g[i-1]-g[i+w-1]+g[i-w+1]+2*g[i+1]+g[i+w+1];
        const gy=-g[i-w-1]-2*g[i-w]-g[i-w+1]+g[i+w-1]+2*g[i+w]+g[i+w+1];
        const m=Math.min(255,Math.hypot(gx,gy)*1.2), j=i*4;
        o.data[j]=o.data[j+1]=o.data[j+2]=20; o.data[j+3]=m>40?m:0;
      }
      x.putImageData(o,0,0); res(c.toDataURL());
    };
    im.src=src;
  });
}
function load(file){
  if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    originalSrc=rd.result; edge=false; gray=false; filters();
    img.onload=()=>{
      img.onload=null;
      W=img.naturalWidth; H=img.naturalHeight;
      img.style.width=W+'px'; img.style.height=H+'px';
      resetView(); startCamera();
    };
    img.onerror=()=>{$('err').textContent='Billedet kunne ikke læses. Prøv et JPG eller PNG.';};
    img.src=originalSrc;
  };
  rd.readAsDataURL(file);
}
function showUI(){
  $('start').style.display='none';
  bar.classList.add('show'); $('toggle').style.display='block';
  hint.style.display='block'; setTimeout(()=>hint.style.display='none',9000);
}
async function startCamera(){
  if(cam.srcObject){ showUI(); return; }
  let msg='';
  if(!window.isSecureContext || !navigator.mediaDevices){
    msg='Kameraet kræver https. Åbn siden via dit github.io-link, ikke som en fil.';
  } else {
    try{
      let stream;
      try{
        stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      }catch(e1){
        if(e1.name==='NotAllowedError') throw e1;
        stream = await navigator.mediaDevices.getUserMedia({video:true,audio:false});
      }
      cam.srcObject = stream; await cam.play().catch(()=>{});
      track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if(!caps.torch) $('torch').style.display='none';
      if('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});
    }catch(e){
      msg = e.name==='NotAllowedError'
        ? 'Kameraet er blokeret. Tillad kamera for denne side i browserens indstillinger, og prøv igen.'
        : 'Kameraet kunne ikke startes ('+e.name+'). Åbn siden i Safari eller Chrome, ikke i en app som Messenger eller Facebook.';
    }
  }
  if(msg){ $('torch').style.display='none'; hint.textContent=msg; }
  showUI();
}
$('file').onchange=e=>{load(e.target.files[0]);e.target.value='';};
$('file2').onchange=e=>{load(e.target.files[0]);e.target.value='';};
$('op').oninput=e=>img.style.opacity=e.target.value/100;
img.style.opacity=.5;
$('gray').onclick=()=>{gray=!gray;filters();};
$('edge').onclick=async()=>{
  edge=!edge;
  img.src = edge ? await makeEdges(originalSrc) : originalSrc;
};
$('flip').onclick=()=>{st.flip*=-1;apply();};
$('reset').onclick=resetView;
$('lock').onclick=e=>{locked=!locked;e.target.textContent=locked?'Lås op':'Lås';e.target.classList.toggle('main',locked);};
$('torch').onclick=async e=>{
  torchOn=!torchOn;
  try{await track.applyConstraints({advanced:[{torch:torchOn}]});e.target.classList.toggle('main',torchOn);}catch(_){}
};
$('toggle').onclick=()=>bar.classList.toggle('hidden');

// Berøring: ét finger = flyt, to fingre = flyt + zoom + drej
const ptr = new Map();
const stage = $('stage');
stage.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointerup',e=>ptr.delete(e.pointerId));
stage.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
stage.addEventListener('pointermove',e=>{
  if(locked||!ptr.has(e.pointerId)) return;
  const prev = ptr.get(e.pointerId);
  if(ptr.size===1){
    st.x += e.clientX-prev.x; st.y += e.clientY-prev.y;
  } else if(ptr.size===2){
    const [a,b]=[...ptr.entries()];
    const other = a[0]===e.pointerId ? b[1] : a[1];
    const pa = Math.hypot(prev.x-other.x, prev.y-other.y);
    const na = Math.hypot(e.clientX-other.x, e.clientY-other.y);
    const ang0 = Math.atan2(prev.y-other.y, prev.x-other.x);
    const ang1 = Math.atan2(e.clientY-other.y, e.clientX-other.x);
    if(pa>0) st.s *= na/pa;
    st.r += (ang1-ang0)*st.flip;
    st.x += (e.clientX-prev.x)/2; st.y += (e.clientY-prev.y)/2;
  }
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  apply();
});
stage.addEventListener('wheel',e=>{if(locked)return;e.preventDefault();st.s*=e.deltaY<0?1.06:0.94;apply();},{passive:false});
</script>
</body>
</html>
